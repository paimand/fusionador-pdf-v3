<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprimir PDF - Suite PDF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/compress.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Volver al inicio</a>

        <header class="tool-header">
            <a href="index.html" style="text-decoration:none; color:inherit;">
                <img src="https://i.ibb.co/RTgVzm5q/Suite-PDF-removebg-preview.png" alt="Suite PDF">
            </a>
            <p>Reduce el tamaño de tu archivo PDF optimizando sus objetos y estructura interna.</p>
        </header>

        <div class="upload-area" id="dropZoneCompress">
            <p>Arrastra o selecciona un PDF para comprimir</p>
            <input type="file" id="fileInputCompress" accept=".pdf">
        </div>

        <div id="compressOptions" style="display:none; margin-bottom:16px;">
            <label for="compressionLevel" style="font-size:0.9rem; font-weight:600; color:#374151; display:block; margin-bottom:6px;">
                Nivel de optimización:
            </label>
            <select id="compressionLevel" class="select-control">
                <option value="medium" selected>Recomendada (Balance de peso y calidad)</option>
                <option value="high">Alta compresión (Mayor reducción de peso)</option>
            </select>
        </div>

        <div class="actions">
            <button id="compressBtn" class="btn btn-primary">Comprimir PDF</button>
        </div>
        <div id="compressStatus" style="margin-top:12px;"></div>
        <div id="loading" style="display:none;">⏳ Comprimiendo archivo...</div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/compress.js"></script>
</body>
</html>
