<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprimir PDF - Suite PDF</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ec9b59;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .compress-options {
            margin: 16px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        .compress-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .quality-hint {
            font-size: 14px;
            color: #6e6e73;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">← Volver al inicio</a>

        <header class="tool-header">
            <img src="https://i.ibb.co/RTgVzm5q/Suite-PDF-removebg-preview.png" alt="Suite PDF">
            <h1>Comprimir PDF</h1>
            <p>Reduce el tamaño de tu PDF eligiendo el nivel de compresión.</p>
        </header>

        <div class="upload-area" id="dropZoneCompress">
            <p>Arrastra o selecciona un PDF para comprimir</p>
            <input type="file" id="fileInputCompress" accept=".pdf">
        </div>

        <div class="compress-options">
            <label>
                <input type="radio" name="compressLevel" value="extreme" checked>
                <span>Extrema</span>
                <span class="quality-hint">(máxima compresión, calidad media)</span>
            </label>
            <label>
                <input type="radio" name="compressLevel" value="recommended">
                <span>Recomendada</span>
                <span class="quality-hint">(equilibrio)</span>
            </label>
            <label>
                <input type="radio" name="compressLevel" value="low">
                <span>Baja compresión</span>
                <span class="quality-hint">(alta calidad, archivo más grande)</span>
            </label>
            <label>
                <input type="radio" name="compressLevel" value="high-quality">
                <span>Máxima calidad</span>
                <span class="quality-hint">(casi sin pérdida, ideal para textos)</span>
            </label>
        </div>

        <div class="actions">
            <button id="compressBtn" class="btn btn-primary">Comprimir PDF</button>
        </div>
        <div id="compressStatus" style="margin-top:12px;"></div>

        <div id="loading">⏳ Procesando... Por favor espera.</div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        let compressFile = null;
        const compressBtn = document.getElementById('compressBtn');

        setupDropZone('dropZoneCompress', 'fileInputCompress', files => {
            compressFile = files[0];
            document.querySelector('#dropZoneCompress p').textContent = `📄 ${compressFile.name}`;
        });

        compressBtn.addEventListener('click', async () => {
            if (!compressFile) { alert('Selecciona un PDF para comprimir'); return; }

            const level = document.querySelector('input[name="compressLevel"]:checked').value;
            compressBtn.disabled = true;
            showLoading(true);
            showStatus('compressStatus', '⏳ Procesando optimización...');

            try {
                let params = {};
                switch (level) {
                    case 'extreme':
                        params = { maxWidth: 1000, quality: 0.6, minDimension: 800 };
                        break;
                    case 'recommended':
                        params = { maxWidth: 1600, quality: 0.8, minDimension: 1200 };
                        break;
                    case 'low':
                        params = { maxWidth: 2200, quality: 0.9, minDimension: 1600 };
                        break;
                    case 'high-quality':
                        params = { maxWidth: 3000, quality: 0.95, minDimension: 2000 };
                        break;
                    default:
                        params = { maxWidth: 1600, quality: 0.8, minDimension: 1200 };
                }

                const images = await rasterizePdfToImages(compressFile, params);

                if (images.length === 0) {
                    throw new Error('No se generaron imágenes del PDF');
                }

                showStatus('compressStatus', `⏳ Generando PDF comprimido (${images.length} páginas)...`);

                await generatePdfFromImages(images, `compressed_${level}.pdf`, level);

                showStatus('compressStatus', '✅ PDF comprimido correctamente');
            } catch (err) {
                showStatus('compressStatus', '❌ ' + err.message, true);
                console.error(err);
            } finally {
                compressBtn.disabled = false;
                showLoading(false);
            }
        });
    </script>

</body>
</html>
