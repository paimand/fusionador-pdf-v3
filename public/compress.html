<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprimir PDF - Suite PDF</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Cargar pdf.js para procesamiento rápido en cliente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="/">📄 SuitePDF</a>
            </div>
            <ul class="nav-links">
                <li><a href="/merge.html">Unir PDF</a></li>
                <li><a href="/split.html">Dividir PDF</a></li>
                <li><a href="/compress.html" class="active">Comprimir PDF</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="tool-section">
            <h1>Comprimir archivo PDF</h1>
            <p class="subtitle">Consigue que tu documento sea más liviano manteniendo la mejor calidad posible.</p>

            <!-- Zona de subida de archivos -->
            <div id="dropZoneCompress" class="drop-zone">
                <p>Arrastra y suelta tu archivo PDF aquí o haz clic para seleccionar</p>
                <input type="file" id="fileInputCompress" accept="application/pdf" hidden>
            </div>

            <!-- Opciones de nivel de compresión (Sin porcentajes ni texto entre paréntesis) -->
            <div class="options-container">
                <h3>Nivel de compresión</h3>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="compressLevel" value="extreme">
                        <span class="radio-custom"></span>
                        <div class="option-text">
                            <strong>Compresión extrema</strong>
                            <p>Menor calidad, alta compresión</p>
                        </div>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="compressLevel" value="recommended" checked>
                        <span class="radio-custom"></span>
                        <div class="option-text">
                            <strong>Compresión recomendada</strong>
                            <p>Buena calidad, buena compresión</p>
                        </div>
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="compressLevel" value="low">
                        <span class="radio-custom"></span>
                        <div class="option-text">
                            <strong>Baja compresión</strong>
                            <p>Alta calidad, menos compresión</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Botón de acción -->
            <div class="action-container">
                <button id="compressBtn" class="btn btn-primary">Comprimir PDF</button>
            </div>

            <!-- Mensaje de estado -->
            <div id="compressStatus" class="status-message"></div>
        </section>
    </main>

    <!-- Scripts utilitarios y lógica principal -->
    <script src="js/utils.js"></script>
    <script src="js/compress.js"></script>
</body>
</html>
