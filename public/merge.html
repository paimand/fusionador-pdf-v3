<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unir PDFs - Suite PDF</title>
    
    <!-- Librerías externas -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- Fuentes y estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/merge.css">
</head>
<body>

<div id="app-header"></div>
    
    <div class="container">
        <a href="/" class="back-link">← Volver al inicio</a>

        <header class="tool-header">
            <img src="https://i.ibb.co/RTgVzm5q/Suite-PDF-removebg-preview.png" alt="Suite PDF">
            <h1>Unir PDFs</h1>
            <p>Selecciona varios PDFs y ordénalos arrastrando. Los archivos no compatibles se omitirán automáticamente.</p>
        </header>

        <!-- Área de subida -->
        <div class="upload-area" id="dropZoneMerge">
            <p>Arrastra aquí tus PDF o haz clic para seleccionarlos</p>
            <input type="file" id="fileInputMerge" accept=".pdf" multiple>
        </div>

        <!-- Lista de archivos -->
        <div class="file-list-header">
            <h2>Archivos seleccionados</h2>
            <span class="file-count" id="fileCountMerge">0 archivos</span>
        </div>
        <ul id="fileListMerge" class="file-list"></ul>

        <!-- Acciones -->
        <div class="actions" style="margin-top: 24px;">
            <button id="clearMerge" class="btn btn-secondary">Vaciar lista</button>
            <button id="mergeBtn" class="btn btn-primary">Unir PDFs</button>
        </div>

        <div id="mergeStatus" style="margin-top:12px;"></div>
        <div id="mergeOmitted" style="margin-top:12px;"></div>

        <div id="loading">⏳ Procesando... Por favor espera.</div>
    </div>

    <!-- Scripts modularizados -->
    <script src="/js/common.js"></script>
    <script src="/js/merge.js"></script>

</body>
</html>
