<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reordenar Páginas PDF - Suite PDF</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/reorder.css">
</head>
<body>

<div id="app-header"></div>
    
    <div class="container">
        <a href="index.html" class="back-link">← Volver al inicio</a>

        <header class="tool-header">
            <a href="index.html" style="text-decoration:none; color:inherit;">
                <img src="https://i.ibb.co/RTgVzm5q/Suite-PDF-removebg-preview.png" alt="Suite PDF">
            </a>
            <p>Arrastra las páginas para cambiar el orden del documento.</p>
        </header>

        <div class="upload-area" id="dropZoneReorder">
            <p>Arrastra o selecciona un PDF para reordenar páginas</p>
            <input type="file" id="fileInputReorder" accept=".pdf">
        </div>

        <div id="reorderPreview" style="display:none; margin-bottom:16px;">
            <p style="font-size: 0.85rem; color: #6b7280; margin-bottom: 8px;">💡 Arrastra las tarjetas para cambiar la secuencia de páginas.</p>
            <div id="reorderPageGrid" class="page-grid"></div>
        </div>

        <div class="actions">
            <button id="reorderBtn" class="btn btn-primary">Guardar Nuevo Orden</button>
        </div>
        <div id="reorderStatus" style="margin-top:12px;"></div>
        <div id="loading" style="display:none;">⏳ Procesando...</div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/reorder.js"></script>

<div id="app-footer"></div>
    
</body>
</html>
