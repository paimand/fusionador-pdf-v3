<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dividir PDF - Suite PDF</title>
    
    <!-- Librería externa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- Fuentes y estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .page-card {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px;
            background: #fff;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
        }
        .page-card.selected {
            border-color: #2563eb;
            background-color: #eff6ff;
        }
        .page-card canvas {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
            margin: 0 auto 6px auto;
        }
        .page-card span {
            font-size: 0.8rem;
            font-weight: 600;
            color: #374151;
        }
    </style>
</head>
<body>

    <div id="app-header"></div>
    
    <div class="container">
        <header class="tool-header">
            <h1>Dividir PDF</h1>
            <p>Divide un PDF en partes seleccionando páginas o rangos.</p>
        </header>

        <!-- Área de subida -->
        <div class="upload-area" id="dropZoneSplit">
            <p>Arrastra o selecciona un PDF para dividir</p>
            <input type="file" id="fileInputSplit" accept=".pdf">
        </div>

        <!-- Opciones de modo -->
        <div style="margin: 16px 0;">
            <label>
                <input type="radio" name="splitMode" value="individual" checked> Dividir en páginas individuales
            </label>
            <label style="margin-left: 20px;">
                <input type="radio" name="splitMode" value="ranges"> Dividir por rangos
            </label>
        </div>

        <!-- Vista previa de cuadrícula -->
        <div id="splitPreview" style="display:none; margin-bottom:16px;">
            <div class="grid-controls" style="margin-bottom: 12px;">
                <button id="splitSelectAll" class="btn btn-secondary" style="padding:6px 14px;">Seleccionar todas</button>
                <button id="splitDeselectAll" class="btn btn-secondary" style="padding:6px 14px;">Deseleccionar todas</button>
            </div>
            <div id="splitPageGrid" class="page-grid"></div>
        </div>

        <!-- Entrada de rangos opcional -->
        <div id="splitRangesContainer" style="display:none; margin-bottom:16px;">
            <label for="splitRanges">Rangos (ej. 1,3-5,7):</label>
            <input type="text" id="splitRanges" placeholder="Ej: 1,3-5,7" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-top:6px;">
        </div>

        <!-- Acciones -->
        <div class="actions">
            <button id="splitBtn" class="btn btn-primary">Dividir</button>
        </div>
        
        <div id="splitStatus" style="margin-top:12px;"></div>
        <div id="loading" style="display:none;">⏳ Procesando...</div>
    </div>

    <div id="app-footer"></div>

    <!-- Scripts modularizados -->
    <script src="/js/common.js"></script>
    <script src="/js/split.js"></script>

</body>
</html>
