<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dividir PDF - SuitePDF</title>
  
  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/split.css">
  
  <!-- PDF.js para renderizado de miniaturas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="top-nav">
        <a href="/" class="btn-back">← Volver al inicio</a>
      </div>
      <h1>Dividir PDF</h1>
      <p>Extrae páginas o divide tu documento en archivos independientes.</p>
    </header>

    <main class="main-content">
      <!-- Zona de subida de archivos -->
      <section class="upload-section" id="uploadArea">
        <input type="file" id="fileInput" accept="application/pdf" hidden />
        <label for="fileInput" class="drop-zone">
          <div class="icon">📄</div>
          <p>Haz clic o arrastra un archivo PDF aquí</p>
        </label>
      </section>

      <!-- Panel de trabajo -->
      <section class="workspace-section" id="workspace" style="display: none;">
        <div class="file-info">
          <span id="fileName" class="file-name">documento.pdf</span>
          <button id="btnRemoveFile" class="btn-secondary-sm">Cambiar PDF</button>
        </div>

        <div class="split-options">
          <h3>Modo de división</h3>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="splitMode" value="single" checked>
              <span>Dividir en páginas individuales</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="splitMode" value="range">
              <span>Dividir por rango de páginas</span>
            </label>
          </div>

          <div id="rangeInputContainer" class="range-container" style="display: none;">
            <label for="pageRanges">Especifica los rangos (Ejemplo: 1-3, 5, 8-10):</label>
            <input type="text" id="pageRanges" placeholder="ej. 1-3, 5" class="input-text">
          </div>
        </div>

        <!-- Vista previa y contenedor de miniaturas -->
        <div class="preview-container">
          <h3>Páginas del documento</h3>
          <div id="thumbnailsGrid" class="thumbnails-grid"></div>
        </div>

        <div class="actions">
          <button id="btnProcessSplit" class="btn-primary">Dividir PDF</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/split.js"></script>
</body>
</html>
