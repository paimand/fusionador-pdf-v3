<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dividir PDF - Suite PDF</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="container">
        <header class="tool-header">
            <a href="index.html" style="text-decoration:none; color:inherit;">
                <img src="https://i.ibb.co/RTgVzm5q/Suite-PDF-removebg-preview.png" alt="Suite PDF">
            </a>
            <p>Divide un PDF en partes seleccionando páginas o rangos.</p>
        </header>

        <div class="upload-area" id="dropZoneSplit">
            <p>Arrastra o selecciona un PDF para dividir</p>
            <input type="file" id="fileInputSplit" accept=".pdf">
        </div>

        <div style="margin: 16px 0;">
            <label>
                <input type="radio" name="splitMode" value="individual" checked> Dividir en páginas individuales
            </label>
            <label style="margin-left: 20px;">
                <input type="radio" name="splitMode" value="ranges"> Dividir por rangos
            </label>
        </div>

        <div id="splitPreview" style="display:none; margin-bottom:16px;">
            <div class="grid-controls">
                <button id="splitSelectAll" class="btn btn-secondary" style="padding:6px 14px;">Seleccionar todas</button>
                <button id="splitDeselectAll" class="btn btn-secondary" style="padding:6px 14px;">Deseleccionar todas</button>
            </div>
            <div id="splitPageGrid" class="page-grid"></div>
        </div>

        <div id="splitRangesContainer" style="display:none; margin-bottom:16px;">
            <label for="splitRanges">Rangos (ej. 1,3-5,7):</label>
            <input type="text" id="splitRanges" placeholder="Ej: 1,3-5,7" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;">
        </div>

        <div class="actions">
            <button id="splitBtn" class="btn btn-primary">Dividir</button>
        </div>
        <div id="splitStatus" style="margin-top:12px;"></div>
        <div id="loading">⏳ Procesando...</div>
    </div>

    <script src="js/common.js"></script>
    <script>
        // ============================================================
        // LÓGICA ESPECÍFICA DE SPLIT
        // ============================================================
        let splitFile = null;
        let splitSelections = [];
        const splitBtn = document.getElementById('splitBtn');
        const splitRangesInput = document.getElementById('splitRanges');
        const splitRangesContainer = document.getElementById('splitRangesContainer');

        document.querySelectorAll('input[name="splitMode"]').forEach(radio => {
            radio.addEventListener('change', () => {
                splitRangesContainer.style.display = radio.value === 'ranges' ? 'block' : 'none';
                document.getElementById('splitPreview').style.display = radio.value === 'individual' ? 'block' : 'none';
            });
        });

        setupDropZone('dropZoneSplit', 'fileInputSplit', files => {
            splitFile = files[0];
            document.querySelector('#dropZoneSplit p').textContent = `📄 ${splitFile.name}`;
            renderPageGrid(splitFile, 'splitPageGrid', splitSelections);
        });

        document.getElementById('splitSelectAll').addEventListener('click', () => {
            splitSelections.fill(true);
            renderPageGrid(splitFile, 'splitPageGrid', splitSelections);
        });
        document.getElementById('splitDeselectAll').addEventListener('click', () => {
            splitSelections.fill(false);
            renderPageGrid(splitFile, 'splitPageGrid', splitSelections);
        });

        splitBtn.addEventListener('click', async () => {
            if (!splitFile) { alert('Primero selecciona un PDF'); return; }
            const mode = document.querySelector('input[name="splitMode"]:checked').value;
            let pagesToSend = '';
            
            if (mode === 'individual') {
                const selectedIndices = splitSelections.map((sel, idx) => sel ? idx + 1 : null).filter(v => v !== null);
                if (selectedIndices.length === 0) { alert('Selecciona al menos una página'); return; }
                pagesToSend = selectedIndices.join(',');
            } else {
                pagesToSend = splitRangesInput.value.trim();
                if (!pagesToSend) { alert('Introduce rangos válidos'); return; }
            }
            
            splitBtn.disabled = true;
            showLoading(true);
            try {
                const formData = new FormData();
                formData.append('file', splitFile);
                formData.append('mode', mode);
                formData.append('ranges', pagesToSend);
                const resp = await fetch('/split', { method: 'POST', body: formData });
                if (!resp.ok) throw new Error(await resp.text());
                downloadFile(await resp.blob(), 'split.pdf');
                showStatus('splitStatus', '✅ División completada');
            } catch (err) {
                showStatus('splitStatus', '❌ ' + err.message, true);
            } finally {
                splitBtn.disabled = false;
                showLoading(false);
            }
        });
    </script>
</body>
</html>
